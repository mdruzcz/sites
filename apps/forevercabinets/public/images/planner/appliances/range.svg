  <g fill="none" stroke="#8d949b" stroke-width="3"><circle cx="96" cy="89" r="9"/><circle cx="140" cy="89" r="7"/><circle cx="182" cy="89" r="9"/><circle cx="218" cy="89" r="6"/></g>
