    <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f45"/><stop offset="1" stop-color="#1c1f23"/></linearGradient>
  </defs>
  <rect width="300" height="300" fill="#fff"/>
