  <rect x="52" y="40" width="196" height="34" rx="3" fill="url(#st)" stroke="#9aa1a8"/>
  <g fill="#2b2f34"><circle cx="86" cy="57" r="6"/><circle cx="112" cy="57" r="6"/><circle cx="188" cy="57" r="6"/><circle cx="214" cy="57" r="6"/></g>
  <rect x="132" y="50" width="36" height="14" rx="2" fill="#1c1f23"/>
