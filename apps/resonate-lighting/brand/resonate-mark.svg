<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Resonate Lighting mark">
  <defs>
    <linearGradient id="rl-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
  </defs>
  <!-- sound wave -->
  <rect x="6" y="24" width="5" height="16" rx="2.5" fill="url(#rl-grad)"/>
  <rect x="14" y="14" width="5" height="36" rx="2.5" fill="url(#rl-grad)"/>
  <rect x="22" y="19" width="5" height="26" rx="2.5" fill="url(#rl-grad)"/>
  <!-- wave resolving into pixels -->
  <circle cx="35" cy="20" r="2.2" fill="url(#rl-grad)" opacity="0.55"/>
  <circle cx="35" cy="32" r="2.6" fill="url(#rl-grad)" opacity="0.7"/>
  <circle cx="35" cy="44" r="2.2" fill="url(#rl-grad)" opacity="0.55"/>
  <circle cx="46" cy="20" r="2.8" fill="url(#rl-grad)" opacity="0.8"/>
  <circle cx="46" cy="32" r="3.2" fill="url(#rl-grad)" opacity="0.9"/>
  <circle cx="46" cy="44" r="2.8" fill="url(#rl-grad)" opacity="0.8"/>
  <circle cx="57" cy="20" r="3.2" fill="url(#rl-grad)"/>
  <circle cx="57" cy="32" r="3.6" fill="url(#rl-grad)"/>
  <circle cx="57" cy="44" r="3.2" fill="url(#rl-grad)"/>
</svg>
