<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Built-in dishwasher">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#c9ced3"/><stop offset="1" stop-color="#e9ecee"/></linearGradient>
  </defs>
  <rect width="300" height="300" fill="#fff"/>
  <!-- counter above (ghost) -->
  <rect x="40" y="36" width="220" height="10" fill="#e8e6e0" stroke="#d2cfc6"/>
  <!-- body -->
  <rect x="62" y="46" width="176" height="212" fill="url(#st)" stroke="#9aa1a8"/>
  <!-- control strip -->
  <rect x="62" y="46" width="176" height="20" fill="#2b2f34"/>
  <g fill="#8d949b"><circle cx="86" cy="56" r="3"/><circle cx="100" cy="56" r="3"/><circle cx="114" cy="56" r="3"/><rect x="190" y="52" width="34" height="8" rx="2" fill="#5fd39a" opacity=".9"/></g>
  <!-- door panel -->
  <rect x="70" y="84" width="160" height="160" rx="3" fill="#dfe3e6" stroke="#aab1b7"/>
  <!-- handle -->
  <rect x="84" y="72" width="132" height="8" rx="4" fill="#b8bec4"/>
  <!-- toe kick -->
  <rect x="66" y="244" width="168" height="14" fill="#4d545b"/>
</svg>
