<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="French-door refrigerator">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#c9ced3"/><stop offset="1" stop-color="#e9ecee"/></linearGradient>
  </defs>
  <rect width="300" height="300" fill="#fff"/>
  <rect x="78" y="24" width="144" height="252" rx="6" fill="url(#st)" stroke="#9aa1a8"/>
  <!-- french doors -->
  <line x1="150" y1="30" x2="150" y2="176" stroke="#8f979e" stroke-width="2"/>
  <rect x="138" y="70" width="6" height="90" rx="3" fill="#b8bec4"/>
  <rect x="156" y="70" width="6" height="90" rx="3" fill="#b8bec4"/>
  <!-- freezer drawer -->
  <line x1="84" y1="182" x2="216" y2="182" stroke="#8f979e" stroke-width="2"/>
  <rect x="104" y="196" width="92" height="6" rx="3" fill="#b8bec4"/>
  <!-- dispenser -->
  <rect x="96" y="60" width="30" height="46" rx="3" fill="#2b2f34"/>
  <rect x="100" y="64" width="22" height="10" rx="2" fill="#5fd39a" opacity=".9"/>
</svg>
