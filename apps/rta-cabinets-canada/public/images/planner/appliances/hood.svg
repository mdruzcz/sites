<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Under-cabinet range hood">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#c9ced3"/><stop offset="1" stop-color="#e9ecee"/></linearGradient>
  </defs>
  <rect width="300" height="300" fill="#fff"/>
  <!-- cabinet above (ghost) -->
  <rect x="60" y="60" width="180" height="60" fill="#f6f6f4" stroke="#d8dbde" stroke-dasharray="4 3"/>
  <!-- hood body -->
  <path d="M60 122 H240 V150 L232 172 H68 L60 150 Z" fill="url(#st)" stroke="#9aa1a8"/>
  <rect x="60" y="122" width="180" height="6" fill="#b3b9bf"/>
  <!-- control strip + lights -->
  <rect x="150" y="156" width="70" height="8" rx="2" fill="#2b2f34"/>
  <rect x="78" y="156" width="40" height="8" rx="2" fill="#f2e9c8" stroke="#d9cf9f"/>
  <!-- grease filter hint -->
  <g stroke="#a7aeb4" stroke-width="1.5"><line x1="70" y1="180" x2="230" y2="180"/><line x1="72" y1="186" x2="228" y2="186"/></g>
</svg>
