<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <!-- Warm glow for the arc -->
    <filter id="arcglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft ambient pool glow -->
    <radialGradient id="poolGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── ICON: House silhouette + glowing LED soffit arc ── -->
  <!-- Ambient light pool beneath the house -->
  <ellipse cx="34" cy="72" rx="28" ry="7" fill="url(#poolGrad)"/>

  <!-- House body -->
  <rect x="14" y="42" width="40" height="30" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Roof -->
  <path d="M10 44 L34 18 L58 44" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round" fill="none"/>

  <!-- Soffit LED strip — the glowing amber arc along the roofline -->
  <!-- Glow layer (wide, soft) -->
  <path d="M12 44 L34 20 L56 44" stroke="#F5A623" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.18" filter="url(#arcglow)"/>
  <!-- Core bright line -->
  <path d="M12 44 L34 20 L56 44" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#arcglow)"/>

  <!-- Light rays down from soffit -->
  <line x1="18" y1="42" x2="18" y2="58" stroke="#F5A623" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="26" y1="36" x2="22" y2="54" stroke="#F5A623" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="34" y1="33" x2="34" y2="54" stroke="#F5A623" stroke-width="1" stroke-opacity="0.28"/>
  <line x1="42" y1="36" x2="46" y2="54" stroke="#F5A623" stroke-width="1" stroke-opacity="0.22"/>
  <line x1="50" y1="42" x2="50" y2="58" stroke="#F5A623" stroke-width="1" stroke-opacity="0.28"/>

  <!-- ── WORDMARK ── -->
  <!-- "Forever" — white, heavy -->
  <text
    x="78" y="42"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.6"
    fill="#FFFFFF"
  >Forever</text>

  <!-- "Lights" — gold, heavy -->
  <text
    x="78" y="66"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.6"
    fill="#F5A623"
  >Lights</text>

  <!-- Thin gold accent line between words -->
  <line x1="78" y1="47" x2="210" y2="47" stroke="#F5A623" stroke-width="0.8" stroke-opacity="0.30"/>

  <!-- "PERMANENT LED" tagline -->
  <text
    x="79" y="76"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="7.5"
    font-weight="500"
    letter-spacing="2.2"
    fill="#94a3b8"
  >PERMANENT LED</text>
</svg>
