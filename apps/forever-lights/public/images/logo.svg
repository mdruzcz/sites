<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- LED dot row glow -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Icon: soffit track with LED dots -->
  <g transform="translate(0, 10)">
    <!-- Track bar -->
    <rect x="4" y="20" width="52" height="6" rx="3" fill="#F5A623" opacity="0.25"/>
    <!-- LED dots on track -->
    <circle cx="10" cy="23" r="3.5" fill="#F5A623" filter="url(#glow)"/>
    <circle cx="22" cy="23" r="3.5" fill="#F5A623" filter="url(#glow)"/>
    <circle cx="34" cy="23" r="3.5" fill="#F5A623" filter="url(#glow)"/>
    <circle cx="46" cy="23" r="3.5" fill="#F5A623" filter="url(#glow)"/>
    <!-- Light beams downward -->
    <line x1="10" y1="27" x2="6"  y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="10" y1="27" x2="14" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="22" y1="27" x2="17" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="22" y1="27" x2="27" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="34" y1="27" x2="29" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="34" y1="27" x2="39" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="46" y1="27" x2="41" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="46" y1="27" x2="51" y2="44" stroke="#F5A623" stroke-width="1" stroke-opacity="0.35"/>
    <!-- Ambient glow pool at bottom -->
    <ellipse cx="28" cy="46" rx="24" ry="5" fill="#F5A623" opacity="0.12"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="34" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Forever</text>
  <text x="68" y="57" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#F5A623">Lights</text>

  <!-- Tagline -->
  <text x="68.5" y="68" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="400" letter-spacing="1.8" fill="#94a3b8" text-transform="uppercase">PERMANENT LED</text>
</svg>
