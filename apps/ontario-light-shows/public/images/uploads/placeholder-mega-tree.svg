<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070F"/>
    </radialGradient>
    <linearGradient id="strandA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2DAA"/>
      <stop offset="100%" stop-color="#FFB94B"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1600" fill="#05070F"/>
  <rect width="1600" height="1600" fill="url(#bg)"/>

  <!-- Ground spot -->
  <ellipse cx="800" cy="1480" rx="500" ry="40" fill="#00E5FF" opacity="0.12"/>

  <!-- Tree pole -->
  <rect x="795" y="260" width="10" height="1180" fill="#1F2740"/>

  <!-- Top star glow -->
  <circle cx="800" cy="240" r="80" fill="url(#topGlow)" opacity="0.85"/>
  <g fill="#FFB94B" opacity="0.95">
    <polygon points="800,170 815,225 870,225 825,260 845,315 800,285 755,315 775,260 730,225 785,225"/>
  </g>

  <!-- Pixel strands (16 strands forming a cone) -->
  <g stroke-width="3" fill="none" opacity="0.9">
    <line x1="800" y1="260" x2="380" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="460" y2="1440" stroke="url(#strandB)"/>
    <line x1="800" y1="260" x2="540" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="620" y2="1440" stroke="url(#strandB)"/>
    <line x1="800" y1="260" x2="700" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="780" y2="1440" stroke="url(#strandB)"/>
    <line x1="800" y1="260" x2="820" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="900" y2="1440" stroke="url(#strandB)"/>
    <line x1="800" y1="260" x2="980" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="1060" y2="1440" stroke="url(#strandB)"/>
    <line x1="800" y1="260" x2="1140" y2="1440" stroke="url(#strandA)"/>
    <line x1="800" y1="260" x2="1220" y2="1440" stroke="url(#strandB)"/>
  </g>

  <!-- Pixel dots along strands (multi-coloured) -->
  <g>
    <!-- Sample dots across the cone -->
    <circle cx="700" cy="600" r="9" fill="#00E5FF"/>
    <circle cx="900" cy="600" r="9" fill="#FF2DAA"/>
    <circle cx="620" cy="800" r="9" fill="#7C3AED"/>
    <circle cx="980" cy="800" r="9" fill="#FFB94B"/>
    <circle cx="540" cy="1000" r="9" fill="#34D399"/>
    <circle cx="1060" cy="1000" r="9" fill="#00E5FF"/>
    <circle cx="460" cy="1200" r="9" fill="#FF2DAA"/>
    <circle cx="1140" cy="1200" r="9" fill="#7C3AED"/>
    <circle cx="380" cy="1400" r="9" fill="#FFB94B"/>
    <circle cx="1220" cy="1400" r="9" fill="#34D399"/>

    <circle cx="780" cy="700" r="9" fill="#FF2DAA"/>
    <circle cx="820" cy="900" r="9" fill="#7C3AED"/>
    <circle cx="750" cy="1100" r="9" fill="#00E5FF"/>
    <circle cx="850" cy="1300" r="9" fill="#FFB94B"/>

    <circle cx="660" cy="700" r="9" fill="#34D399"/>
    <circle cx="940" cy="700" r="9" fill="#00E5FF"/>
    <circle cx="700" cy="900" r="9" fill="#FF2DAA"/>
    <circle cx="900" cy="900" r="9" fill="#FFB94B"/>
    <circle cx="650" cy="1100" r="9" fill="#7C3AED"/>
    <circle cx="950" cy="1100" r="9" fill="#34D399"/>
    <circle cx="600" cy="1300" r="9" fill="#FF2DAA"/>
    <circle cx="1000" cy="1300" r="9" fill="#00E5FF"/>
  </g>

  <text x="800" y="1560" font-family="system-ui, sans-serif" font-size="22" fill="#00E5FF" text-anchor="middle" letter-spacing="3">PIXEL MEGA TREE · PLACEHOLDER</text>
</svg>
